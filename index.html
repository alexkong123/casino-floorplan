// ========== 工具函数 ==========
function cp(p){ return `casinos/${currentCasinoId}/${p}`; }
function cid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){ const t=document.createElement('div'); t.className='toast-msg'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
function formatWin(w){ if(w===undefined) return '0'; let n=Number(w); if(isNaN(n)) return '0'; return n>0?`+${n.toLocaleString()}`:(n<0?`(${Math.abs(n).toLocaleString()})`:'0'); }
function clearSelection(){ document.querySelectorAll('.canvas-table.selected').forEach(el=>el.classList.remove('selected')); selectedTableIds.clear(); }
function esc(s){ return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
async function batch(upd){ if(Object.keys(upd).length===0) return; await update(ref(db), upd); }

// ========== 登录逻辑 ==========
function performLogin() {
  const user = $('loginUser').value.trim();
  const pwd = $('loginPwd').value;
  const storedPwd = localStorage.getItem('adminPwd') || '123456';

}

$('loginPwd').addEventListener('keypress', e => { if (e.key === 'Enter') performLogin(); });

// ========== 快照与撤销 ==========
function captureState(){
  if(_skipCapture){ _skipCapture=false; return; }
  const s = JSON.parse(JSON.stringify({floorData, availableTables, decorElements, currentFloor}));
  if(historyIndex < historyStack.length-1) historyStack = historyStack.slice(0, historyIndex+1);
  historyStack.push(s);
  if(historyStack.length > MAX_HISTORY) historyStack.shift();
  historyIndex = historyStack.length-1;
}
async function undo(){
  if(historyIndex <= 0){ alert('没有可撤销的操作'); return; }
  historyIndex--;
  const s = historyStack[historyIndex];
  const base = `casinos/${currentCasinoId}`;
  const upd = {};
  upd[`${base}/floors`] = null;
  upd[`${base}/decorations`] = null;
  upd[`${base}/availableTables`] = null;
  Object.keys(s.floorData).forEach(fn => s.floorData[fn].forEach(t=>{
    upd[`${base}/floors/${fn}/${t.id}`] = { x:t.x, y:t.y, status:t.status, type:t.type, zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, angle:t.angle||0, win:t.win||0 };
  }));
  Object.keys(s.availableTables).forEach(id => { upd[`${base}/availableTables/${id}`] = s.availableTables[id]; });
  s.decorElements.forEach(d => { upd[`${base}/decorations/${d.floor}/${d.id}`] = { url:d.url, x:d.x, y:d.y, width:d.width, height:d.height, angle:d.angle }; });
  _skipCapture = true;
  try { await batch(upd); showToast('已撤销'); } catch(e){ console.error(e); showToast('撤销失败'); }
}

// ========== 缩放 ==========
function applyZoom(){
  floorPlanDiv.style.transform = `scale(${currentZoom})`;
  floorPlanDiv.style.transformOrigin = '0 0';
  zoomValueSpan.innerText = `${Math.round(currentZoom*100)}%`;
  const g = 40 * currentZoom;
  canvasAreaDiv.style.backgroundSize = `${g}px ${g}px`;
}
function setZoom(z){ z = Math.min(2.0, Math.max(0.5, z)); if(z===currentZoom) return; currentZoom=z; applyZoom(); }
function adjustCanvasSize(){
  const tables = floorData[currentFloor]||[];
  let maxX = 0, maxY = 0;
  tables.forEach(t=>{ let r=t.x+180,b=t.y+120; if(r>maxX)maxX=r; if(b>maxY)maxY=b; });
  decorElements.filter(d=>d.floor===currentFloor).forEach(d=>{ let r=d.x+d.width,b=d.y+d.height; if(r>maxX)maxX=r; if(b>maxY)maxY=b; });
  maxX = Math.max(maxX, canvasAreaDiv.clientWidth);
  maxY = Math.max(maxY, canvasAreaDiv.clientHeight);
  floorPlanDiv.style.minWidth = Math.max(maxX, canvasAreaDiv.clientWidth)+'px';
  floorPlanDiv.style.minHeight = Math.max(maxY, canvasAreaDiv.clientHeight)+'px';
}

function getTableIconHtml(table){
  const info = TABLE_TYPES[table.type];
  if(!info) return '<div style="font-size:1.5rem;">❓</div>';
  if(table.customIcon) return `<img src="${table.customIcon}">`;
  if(info.customIcon) return `<img src="${info.customIcon}">`;
  if(info.icon) return `<img src="${info.icon}">`;
  return `<div style="font-size:1.5rem;">${info.emoji||'🎲'}</div>`;
}

// ========== 未放置桌子列表 ==========
function updateTableList(){
  tableListDiv.innerHTML = '';
  const ids = Object.keys(availableTables);
  if(!ids.length){ tableListDiv.innerHTML = '<div style="color:#aaa;text-align:center;">暂无未放置桌子<br>点击「添加桌子」创建</div>'; return; }
  ids.forEach(id=>{
    const info = availableTables[id];
    const div = document.createElement('div');
    div.className = 'draggable-table';
    div.setAttribute('data-id', id);
    div.setAttribute('draggable','true');
    div.innerHTML = `<div class="table-info-row"><span class="table-num">#${esc(id)}</span><span class="table-zone">${esc(info.zoneCode||'无场区')}</span><span class="table-zone" style="background:#e67e22;">${esc(info.type)}</span><button class="icon-upload-btn" data-id="${esc(id)}">📷</button><button class="action-btn-small edit-btn" data-id="${esc(id)}">✏️</button><button class="action-btn-small copy-btn" data-id="${esc(id)}">📋</button><button class="delete-table-btn" data-id="${esc(id)}">✖</button></div><div class="table-info-row"><select class="table-type-select" data-id="${esc(id)}">${TYPE_LIST.map(t=>`<option value="${t}" ${t===info.type?'selected':''}>${t} - ${TABLE_TYPES[t]?.name||t}</option>`).join('')}</select></div>`;
    const sel = div.querySelector('.table-type-select');
    sel.onchange = async () => {
      await update(ref(db, cp(`availableTables/${id}`)), { type: sel.value });
      showToast('桌型已更新');
    };
    div.querySelector('.icon-upload-btn').onclick = () => {
      const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange = ev => {
        const file = ev.target.files[0]; if(!file) return;
        const r = new FileReader();
        r.onload = async e2 => { await update(ref(db, cp(`availableTables/${id}`)), { customIcon: e2.target.result }); showToast('图标已更新'); };
        r.readAsDataURL(file);
      };
      inp.click();
    };
    div.querySelector('.edit-btn').onclick = async e => {
      e.stopPropagation();
      const oldId = id, oldZone = info.zoneCode || '', oldType = info.type;
      const newId = prompt('桌号:', oldId); if(newId===null) return;
      const newZone = prompt('场区代号:', oldZone); if(newZone===null) return;
      const newType = prompt('桌型代码:', oldType); if(newType===null) return;
      if(!newId.trim() || !TABLE_TYPES[newType.toUpperCase()]){ alert('输入无效'); return; }
      if(newId.trim() !== oldId && isTableIdUsed(newId.trim(), oldId)){ alert('桌号已存在'); return; }
      const upd = {};
      upd[cp(`availableTables/${oldId}`)] = null;
      upd[cp(`availableTables/${newId.trim()}`)] = { type: newType.toUpperCase(), zoneCode: newZone, customIcon: info.customIcon, win: info.win||0 };
      await batch(upd);
      showToast('已更新');
    };
    div.querySelector('.copy-btn').onclick = async e => {
      e.stopPropagation();
      const newId = prompt('新桌号:', id+'_copy'); if(!newId) return;
      if(isTableIdUsed(newId.trim())){ alert('桌号已存在'); return; }
      await set(ref(db, cp(`availableTables/${newId.trim()}`)), { type: info.type, zoneCode: info.zoneCode||'', customIcon: info.customIcon||null, win: 0 });
      showToast('已复制');
    };
    div.querySelector('.delete-table-btn').onclick = async e => {
      e.stopPropagation();
      if(!confirm(`删除未放置桌子 ${id}？`)) return;
      await remove(ref(db, cp(`availableTables/${id}`)));
      showToast('已删除');
    };
    div.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ id, ...availableTables[id] }));
      e.dataTransfer.effectAllowed = 'copy';
    });
    tableListDiv.appendChild(div);
  });
}
function isTableIdUsed(id, excludeId=null){
  if(id===excludeId) return false;
  for(const f in floorData){ if(floorData[f].some(t=>t.id===id)) return true; }
  return availableTables[id] !== undefined;
}
async function addNewTable(){
  const id = newTableIdInput.value.trim();
  if(!id){ alert('请输入桌号'); return; }
  if(isTableIdUsed(id)){ alert('桌号已存在'); return; }
  await set(ref(db, cp(`availableTables/${id}`)), {
    type: newTableTypeSelect.value,
    zoneCode: newZoneCodeInput.value.trim(),
    customIcon: tempCustomIcon || null,
    win: 0
  });
  addTableModal.style.display = 'none';
  newTableIdInput.value = ''; newZoneCodeInput.value = ''; tempCustomIcon = null; newIconPreview.innerHTML = '';
  showToast('桌子已添加');
}

// ========== 渲染当前楼层 ==========
function renderCurrentFloor(){
  document.querySelectorAll('.canvas-table').forEach(t=>t.remove());
  const tables = floorData[currentFloor] || [];
  tables.forEach(t => { const card = createTableElement(t); floorPlanDiv.appendChild(card); makeDraggable(card); if(selectedTableIds.has(t.id)) card.classList.add('selected'); });
  adjustCanvasSize();
}

function createTableElement(table){
  const div = document.createElement('div');
  let winClass = '';
  if(table.status==='open'){
    if(table.win>0) winClass='win-positive';
    else if(table.win<0) winClass = Math.abs(table.win)>=1000000 ? 'win-critical' : 'win-negative';
  }
  div.className = `canvas-table ${table.status} ${winClass}`;
  div.setAttribute('data-id', table.id);
  div.style.left = `${table.x}px`;
  div.style.top = `${table.y}px`;
  div.style.transform = `rotate(${table.angle||0}deg)`;
  div.innerHTML = `<div class="table-icon">${getTableIconHtml(table)}</div><div class="table-info"><div class="table-number">桌号 ${esc(table.id)}</div><div class="table-type">${esc(table.type)}</div><div class="table-zone">${esc(table.zoneCode||'无场区')}</div><div class="table-status">${table.status==='open'?'🟢 开放':'⚫ 关闭'}</div></div><div class="action-buttons"><div class="action-btn rotate-btn">🔄</div></div>`;
  div.addEventListener('click', e => {
    if(e.target.closest('.action-btn')) return;
    e.stopPropagation();
    if(e.ctrlKey||e.metaKey){ if(selectedTableIds.has(table.id)){ selectedTableIds.delete(table.id); div.classList.remove('selected'); } else { selectedTableIds.add(table.id); div.classList.add('selected'); } }
    else { clearSelection(); selectedTableIds.add(table.id); div.classList.add('selected'); }
    if(currentInfoPanel) currentInfoPanel.remove();
    showInfoPanel(div, table);
  });
  div.querySelector('.rotate-btn').addEventListener('click', e => { e.stopPropagation(); showRotatePanel(div, table.angle||0); });
  return div;
}

// ========== 拖拽 ==========
function makeDraggable(el){
  interact(el).draggable({
    inertia: false,
    listeners: {
      start: () => { if(casinoDataUnsub){ casinoDataUnsub(); casinoDataUnsub = null; } },
      move: e => {
        const dx = e.dx/currentZoom, dy = e.dy/currentZoom;
        if(selectedTableIds.size > 1){
          for(const id of selectedTableIds){
            const card = document.querySelector(`.canvas-table[data-id="${CSS.escape(id)}"]`);
            if(card){ card.style.left = (parseFloat(card.style.left)||0)+dx+'px'; card.style.top = (parseFloat(card.style.top)||0)+dy+'px'; }
          }
        } else {
          el.style.left = (parseFloat(el.style.left)||0)+dx+'px';
          el.style.top = (parseFloat(el.style.top)||0)+dy+'px';
        }
      },
      end: async e => {
        const upd = {};
        if(selectedTableIds.size > 1){
          for(const id of selectedTableIds){
            const card = document.querySelector(`.canvas-table[data-id="${CSS.escape(id)}"]`);
            if(card){ const x = parseFloat(card.style.left); const y = parseFloat(card.style.top); upd[cp(`floors/${currentFloor}/${id}/x`)] = x; upd[cp(`floors/${currentFloor}/${id}/y`)] = y; }
          }
        } else {
          const id = el.getAttribute('data-id');
          upd[cp(`floors/${currentFloor}/${id}/x`)] = parseFloat(el.style.left);
          upd[cp(`floors/${currentFloor}/${id}/y`)] = parseFloat(el.style.top);
        }
        try { await batch(upd); } catch(err){ console.error(err); showToast('同步失败'); }
        adjustCanvasSize();
        bindCasinoData(currentCasinoId);
      }
    }
  });
}

// ========== 信息面板 ==========
function showInfoPanel(card, t){
  if(currentInfoPanel) currentInfoPanel.remove();
  const winF = formatWin(t.win);
  const winC = t.win>0?'win-positive':(t.win<0?'win-negative':'');
  const panel = document.createElement('div');
  panel.className = 'info-panel';
  panel.innerHTML = `<div class="title">📋 桌子信息</div><div class="info-row"><span class="info-label">桌号：</span><span class="info-value">${esc(t.id)}</span></div><div class="info-row"><span class="info-label">桌型：</span><span class="info-value">${esc(t.type)}</span></div><div class="info-row"><span class="info-label">场区：</span><span class="info-value">${esc(t.zoneCode||'无')}</span></div><div class="info-row"><span class="info-label">营业额：</span><span class="info-value ${winC}">💰 ${winF}</span></div><div class="info-row"><span class="info-label">状态：</span><span class="info-value">${t.status==='open'?'开放中':'已关闭'}</span></div><div class="status-buttons"><button class="status-btn open">🟢 开放</button><button class="status-btn closed">⚫ 关闭</button></div><div class="footer-buttons"><button class="footer-btn edit">✏️ 编辑</button><button class="footer-btn delete">🗑️ 删除</button><button class="footer-btn close">关闭</button></div>`;
  const rect = card.getBoundingClientRect(), cRect = canvasAreaDiv.getBoundingClientRect();
  let left = rect.right+10, top = rect.top;
  if(left+240 > cRect.right) left = rect.left-240;
  if(top+240 > cRect.bottom) top = cRect.bottom-250;
  if(top < cRect.top) top = cRect.top+10;
  panel.style.left = left+'px'; panel.style.top = top+'px';
  panel.querySelector('.status-btn.open').onclick = async () => {
    await update(ref(db, cp(`floors/${currentFloor}/${t.id}`)), { status: 'open' });
    showToast('已开放');
    panel.remove(); currentInfoPanel = null;
  };
  panel.querySelector('.status-btn.closed').onclick = async () => {
    await update(ref(db, cp(`floors/${currentFloor}/${t.id}`)), { status: 'closed' });
    showToast('已关闭');
    panel.remove(); currentInfoPanel = null;
  };
  panel.querySelector('.footer-btn.edit').onclick = async () => {
    panel.remove(); currentInfoPanel = null;
    const oldId = t.id;
    const newId = prompt('新桌号:', oldId); if(newId===null) return;
    const newZone = prompt('场区代号:', t.zoneCode||''); if(newZone===null) return;
    if(!newId.trim()){ alert('桌号不能为空'); return; }
    if(newId.trim()!==oldId && isTableIdUsed(newId.trim(), oldId)){ alert('桌号已存在'); return; }
    const upd = {};
    if(newId.trim()!==oldId){
      upd[cp(`floors/${currentFloor}/${oldId}`)] = null;
      upd[cp(`floors/${currentFloor}/${newId.trim()}`)] = { x:t.x, y:t.y, status:t.status, type:t.type, zoneCode:newZone, customIcon:t.customIcon||null, angle:t.angle||0, win:t.win||0 };
    } else {
      upd[cp(`floors/${currentFloor}/${oldId}/zoneCode`)] = newZone;
    }
    await batch(upd);
    showToast('已更新');
  };
  panel.querySelector('.footer-btn.delete').onclick = async () => {
    if(!confirm(`删除桌子 ${t.id}？`)) return;
    const upd = {};
    upd[cp(`floors/${currentFloor}/${t.id}`)] = null;
    upd[cp(`availableTables/${t.id}`)] = { type:t.type, zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, win:t.win||0 };
    await batch(upd);
    panel.remove(); currentInfoPanel = null;
    showToast('已移至未放置');
  };
  panel.querySelector('.footer-btn.close').onclick = () => { panel.remove(); currentInfoPanel = null; };
  document.body.appendChild(panel);
  currentInfoPanel = panel;
  setTimeout(() => {
    const h = e => { if(!panel.contains(e.target) && e.target!==card && !card.contains(e.target)){ panel.remove(); currentInfoPanel=null; document.removeEventListener('click',h); } };
    document.addEventListener('click', h);
  }, 100);
}

// ========== Drop ==========
function initDropTarget(){
  floorPlanDiv.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  floorPlanDiv.addEventListener('drop', async e => {
    e.preventDefault();
    let id, info;
    try { const p = JSON.parse(e.dataTransfer.getData('text/plain')); id = p.id; info = p; } catch(err){ return; }
    if(!id) return;
    const rect = floorPlanDiv.getBoundingClientRect();
    let x = (e.clientX - rect.left + canvasAreaDiv.scrollLeft) / currentZoom;
    let y = (e.clientY - rect.top + canvasAreaDiv.scrollTop) / currentZoom;
    x = Math.max(0, x); y = Math.max(0, y);
    const upd = {};
    upd[cp(`availableTables/${id}`)] = null;
    upd[cp(`floors/${currentFloor}/${id}`)] = { x, y, status:'closed', type: info.type, zoneCode: info.zoneCode||'', customIcon: info.customIcon||null, angle:0, win: info.win||0 };
    await batch(upd);
    showToast('已放置');
  });
}

// ========== 对齐/分布 ==========
function getSelected(){ return (floorData[currentFloor]||[]).filter(t => selectedTableIds.has(t.id)); }
async function applyLayout(fn){
  const tables = getSelected();
  if(tables.length < 2) return;
  fn(tables);
  const upd = {};
  tables.forEach(t => { upd[cp(`floors/${currentFloor}/${t.id}/x`)] = t.x; upd[cp(`floors/${currentFloor}/${t.id}/y`)] = t.y; });
  await batch(upd);
  showToast('已应用');
}
function alignLeft(){ applyLayout(ts=>{ const m=Math.min(...ts.map(t=>t.x)); ts.forEach(t=>t.x=m); }); }
function alignRight(){ applyLayout(ts=>{ const m=Math.max(...ts.map(t=>t.x+170)); ts.forEach(t=>t.x=m-170); }); }
function alignCenterH(){ applyLayout(ts=>{ const c=(Math.min(...ts.map(t=>t.x))+Math.max(...ts.map(t=>t.x+170)))/2-85; ts.forEach(t=>t.x=c); }); }
function alignCenterV(){ applyLayout(ts=>{ const c=(Math.min(...ts.map(t=>t.y))+Math.max(...ts.map(t=>t.y+120)))/2-60; ts.forEach(t=>t.y=c); }); }
function distributeH(){ applyLayout(ts=>{ const s=[...ts].sort((a,b)=>a.x-b.x); const tot=s[s.length-1].x+170-s[0].x; const g=tot/(s.length-1); s.forEach((t,i)=>t.x=s[0].x+i*g); }); }
function distributeV(){ applyLayout(ts=>{ const s=[...ts].sort((a,b)=>a.y-b.y); const tot=s[s.length-1].y+120-s[0].y; const g=tot/(s.length-1); s.forEach((t,i)=>t.y=s[0].y+i*g); }); }

// ========== 装饰 ==========
function renderDecorations(){
  document.querySelectorAll('.decor-item').forEach(el=>el.remove());
  decorElements.filter(d=>d.floor===currentFloor).forEach(d=>{
    const div = document.createElement('div');
    div.className = 'decor-item';
    div.setAttribute('data-decor-id', d.id);
    div.style.left = d.x+'px'; div.style.top = d.y+'px'; div.style.width = d.width+'px'; div.style.height = d.height+'px';
    div.style.transform = `rotate(${d.angle||0}deg)`; div.style.transformOrigin = 'center center';
    div.innerHTML = `<img src="${d.url}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;"><div class="delete-decor" data-id="${d.id}">✖</div><div class="rotate-handle" data-id="${d.id}">↻</div>`;
    floorPlanDiv.appendChild(div);
    makeDecorDraggable(div, d);
    makeDecorRotatable(div, d);
    div.querySelector('.delete-decor').onclick = async e => {
      e.stopPropagation();
      await remove(ref(db, cp(`decorations/${currentFloor}/${d.id}`)));
      showToast('已删除装饰');
    };
  });
  adjustCanvasSize();
}
function makeDecorDraggable(el, d){
  interact(el).draggable({
    inertia: false,
    listeners: {
      move: e => { el.style.left = (parseFloat(el.style.left)||0)+e.dx/currentZoom+'px'; el.style.top = (parseFloat(el.style.top)||0)+e.dy/currentZoom+'px'; },
      end: async () => { await update(ref(db, cp(`decorations/${currentFloor}/${d.id}`)), { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }); adjustCanvasSize(); }
    }
  });
  interact(el).resizable({
    edges: { left:true, right:true, bottom:true, top:true },
    listeners: {
      move: e => {
        let x = parseFloat(el.style.left)||0, y = parseFloat(el.style.top)||0, w = parseFloat(el.style.width)||100, h = parseFloat(el.style.height)||100;
        w += e.deltaRect.width; h += e.deltaRect.height;
        if(w<30) w=30; if(h<30) h=30;
        el.style.width = w+'px'; el.style.height = h+'px';
        if(e.deltaRect.left) el.style.left = (x+e.deltaRect.left)+'px';
        if(e.deltaRect.top) el.style.top = (y+e.deltaRect.top)+'px';
      },
      end: async () => { await update(ref(db, cp(`decorations/${currentFloor}/${d.id}`)), { x: parseFloat(el.style.left), y: parseFloat(el.style.top), width: parseFloat(el.style.width), height: parseFloat(el.style.height) }); adjustCanvasSize(); }
    }
  });
}
function makeDecorRotatable(el, d){
  const handle = el.querySelector('.rotate-handle'); if(!handle) return;
  let sA=0, sX=0, sY=0;
  const mm = e => {
    const dx = e.clientX-sX, dy = e.clientY-sY;
    let a = sA + Math.atan2(dy,dx)*180/Math.PI;
    a = ((a%360)+360)%360;
    el.style.transform = `rotate(${a}deg)`;
    d.angle = a;
  };
  const mu = async () => { document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); await update(ref(db, cp(`decorations/${currentFloor}/${d.id}`)), { angle: d.angle }); };
  handle.addEventListener('mousedown', e => {
    e.stopPropagation();
    sX = e.clientX; sY = e.clientY; sA = d.angle||0;
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
}
async function uploadDecor(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = async ev => {
      const newId = nextDecorId++;
      await set(ref(db, cp(`decorations/${currentFloor}/${newId}`)), { url: ev.target.result, x:100, y:100, width:120, height:120, angle:0 });
      showToast('装饰已添加');
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

// ========== 旋转 ==========
function showRotatePanel(card, angle){ currentRotatingTable = card; angleSlider.value = angle; angleValue.innerText = angle+'°'; rotatePanel.classList.add('show'); }
async function setTableAngle(card, angle){
  if(!card) return;
  card.style.transform = `rotate(${angle}deg)`;
  const id = card.getAttribute('data-id');
  if(rotateTimeout) clearTimeout(rotateTimeout);
  rotateTimeout = setTimeout(async () => {
    await update(ref(db, cp(`floors/${currentFloor}/${id}`)), { angle });
    rotateTimeout = null;
  }, 200);
}
function initRotatePanel(){
  angleSlider.addEventListener('input', e => { const a = parseInt(e.target.value,10); angleValue.innerText = a+'°'; if(currentRotatingTable) setTableAngle(currentRotatingTable, a); });
  const p = document.querySelector('.preset-angles');
  [0,45,90,135,180,225,270,315].forEach(d=>{
    const b = document.createElement('button'); b.className='preset-btn'; b.innerText = d+'°';
    b.onclick = () => { angleSlider.value=d; angleValue.innerText=d+'°'; if(currentRotatingTable) setTableAngle(currentRotatingTable, d); };
    p.appendChild(b);
  });
  $('closeRotatePanel').onclick = () => rotatePanel.classList.remove('show');
  canvasAreaDiv.addEventListener('click', e => { if(!e.target.closest('.rotate-panel') && !e.target.closest('.action-btn.rotate-btn')) rotatePanel.classList.remove('show'); });
}

// ========== 楼层 ==========
function renderFloorTabs(){
  floorTabsContainer.innerHTML = '';
  const keys = Object.keys(floorData);
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'floor-btn' + (key===currentFloor ? ' active' : '');
    btn.innerHTML = `<span>${esc(key)}</span><div class="floor-actions"><button class="edit-floor">✏️</button><button class="del-floor">🗑️</button></div>`;
    btn.onclick = e => { if(e.target.classList.contains('edit-floor')||e.target.classList.contains('del-floor')) return; switchFloor(key); };
    btn.querySelector('.edit-floor').onclick = async e => {
      e.stopPropagation();
      const newName = prompt('新楼层名:', key);
      if(!newName || !newName.trim() || newName.trim()===key) return;
      if(floorData[newName.trim()]){ alert('楼层已存在'); return; }
      const upd = {};
      (floorData[key]||[]).forEach(t => { upd[cp(`floors/${newName.trim()}/${t.id}`)] = { x:t.x, y:t.y, status:t.status, type:t.type, zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, angle:t.angle||0, win:t.win||0 }; });
      upd[cp(`floors/${key}`)] = null;
      decorElements.filter(d=>d.floor===key).forEach(d => { upd[cp(`decorations/${newName.trim()}/${d.id}`)] = { url:d.url, x:d.x, y:d.y, width:d.width, height:d.height, angle:d.angle }; });
      upd[cp(`decorations/${key}`)] = null;
      await batch(upd);
      if(currentFloor===key) currentFloor = newName.trim();
      showToast('楼层已重命名');
    };
    btn.querySelector('.del-floor').onclick = async e => {
      e.stopPropagation();
      if(Object.keys(floorData).length<=1){ alert('至少保留一个楼层'); return; }
      if(!confirm(`删除楼层 ${key}？桌子将移至未放置`)) return;
      const upd = {};
      (floorData[key]||[]).forEach(t => { upd[cp(`availableTables/${t.id}`)] = { type:t.type, zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, win:t.win||0 }; });
      upd[cp(`floors/${key}`)] = null;
      upd[cp(`decorations/${key}`)] = null;
      await batch(upd);
      showToast('楼层已删除');
    };
    floorTabsContainer.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-floor-btn';
  addBtn.innerText = '+ 添加楼层';
  addBtn.onclick = async () => {
    const n = prompt('楼层名称:');
    if(!n || !n.trim()) return;
    if(floorData[n.trim()]){ alert('楼层已存在'); return; }
    await set(ref(db, cp(`floors/${n.trim()}`)), {});
    switchFloor(n.trim());
    showToast('楼层已添加');
  };
  floorTabsContainer.appendChild(addBtn);
  currentFloorLabel.innerText = currentFloor || '';
}
function switchFloor(k){ currentFloor = k; clearSelection(); renderCurrentFloor(); renderDecorations(); renderFloorTabs(); renderStats(); updateStatsBar(); }

// ========== 统计 ==========
function updateStatsBar(){
  const tables = floorData[currentFloor] || [];
  const map = new Map();
  tables.forEach(t=>{ if(!map.has(t.type)) map.set(t.type,{o:0,c:0}); const s=map.get(t.type); if(t.status==='open') s.o++; else s.c++; });
  if(!map.size){ statsInline.innerHTML = '<div class="stats-item-inline">暂无桌子</div>'; return; }
  let html = '';
  for(const [code, s] of map){ html += `<div class="stats-item-inline"><div class="stats-numbers-inline"><span class="stats-open-inline">🟢 ${s.o}</span><span class="stats-closed-inline">⚫ ${s.c}</span></div><div class="stats-label-inline">${esc(code)}</div></div>`; }
  statsInline.innerHTML = html;
}
function renderStats(){
  const tables = floorData[currentFloor] || [];
  const zones = new Map();
  tables.forEach(t=>{ const z = t.zoneCode?.trim()||'未分配场区'; if(!zones.has(z)) zones.set(z,{t:[],w:0}); const g=zones.get(z); g.t.push(t); g.w += t.win||0; });
  if(!zones.size){ statsContent.innerHTML = '<div style="text-align:center;padding:20px;">暂无数据</div>'; return; }
  let html = '';
  for(const [zone, g] of zones){
    g.t.sort((a,b)=>{ if(a.status==='open' && b.status!=='open') return -1; if(a.status!=='open' && b.status==='open') return 1; const an=parseInt(a.id), bn=parseInt(b.id); return !isNaN(an)&&!isNaN(bn) ? an-bn : a.id.localeCompare(b.id); });
    const wc = g.w>0?'win-positive':(g.w<0?'win-negative':'');
    html += `<div class="zone-group"><div class="zone-header"><div class="zone-name">🏷️ ${esc(zone)}</div><div class="zone-total ${wc}">💰 ${formatWin(g.w)}</div></div><ul class="table-list-stats open">${g.t.map(t=>`<li><span class="table-id ${t.status==='open'?'table-id-open':'table-id-closed'}">🪑 ${esc(t.id)}</span><span class="table-win ${t.win>0?'win-positive':(t.win<0?'win-negative':'win-zero')}">${formatWin(t.win)}</span></li>`).join('')}</ul></div>`;
  }
  statsContent.innerHTML = html;
  statsContent.querySelectorAll('.zone-header').forEach(h=>{ h.onclick = () => h.nextElementSibling.classList.toggle('open'); });
}

// ========== 桌型 ==========
function refreshAllTypeSelects(){
  newTableTypeSelect.innerHTML = TYPE_LIST.map(t => `<option value="${t}">${t} - ${TABLE_TYPES[t]?.name||t}</option>`).join('');
  updateTableList();
}

function initPresetIconsGrid() {
  const grid = $('presetIconsGrid');
  grid.innerHTML = '';
  Object.keys(PRESET_ICONS).forEach(key => {

async function addNewTableType(){
  let code = newTypeCodeInput.value.trim().toUpperCase();
  if(!code){ alert('请输入代码'); return; }
  if(TABLE_TYPES[code]){ alert('已存在'); return; }
  const name = newTypeNameInput.value.trim();
  if(!name){ alert('请输入名称'); return; }
  const emoji = newTypeEmojiInput.value.trim() || '🎲';
  
  const iconToUse = newTypeTempIcon || selectedPresetIcon || null;
  
  await set(ref(db, `customTypes/${code}`), { name, emoji, customIcon: iconToUse });
  newTypeModal.style.display = 'none';
  newTypeCodeInput.value = ''; newTypeNameInput.value = ''; newTypeEmojiInput.value = ''; newTypeTempIcon = null; selectedPresetIcon = null; newTypeIconPreview.innerHTML = '';
  showToast('桌型已新增');
}

// ========== Excel ==========
function importExcel(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
      if(rows.length<2){ alert('至少需要两行'); return; }
      const h = rows[0].map(c => String(c).toLowerCase().trim());
      let idC = -1, winC = -1, zoneC = -1, typeC = -1;
      h.forEach((cell,i)=>{
        if(cell.includes('桌号')||cell.includes('table')||cell.includes('id')) idC = i;
        if(cell.includes('win')||cell.includes('营业额')||cell.includes('赢')) winC = i;
        if(cell.includes('场区')||cell.includes('zone')) zoneC = i;
        if(cell.includes('桌型')||cell.includes('type')) typeC = i;
      });
      if(idC === -1){ alert('未找到桌号列'); return; }
      const upd = {};
      let nWin=0, nZone=0, nType=0;
      for(let i=1; i<rows.length; i++){
        const r = rows[i];
        const id = String(r[idC]||'').trim();
        if(!id) continue;
        let found = null, floorOf = null;
        for(const f in floorData){ const t = floorData[f].find(x=>x.id===id); if(t){ found=t; floorOf=f; break; } }
        if(!found){ continue; }
        if(winC !== -1){ const v = parseFloat(r[winC]); if(!isNaN(v) && v !== found.win){ upd[cp(`floors/${floorOf}/${id}/win`)] = v; nWin++; } }
        if(zoneC !== -1 && r[zoneC] !== undefined){ const z = String(r[zoneC]).trim(); if(z && z !== found.zoneCode){ upd[cp(`floors/${floorOf}/${id}/zoneCode`)] = z; nZone++; } }
        if(typeC !== -1 && r[typeC] !== undefined){ const ty = String(r[typeC]).trim().toUpperCase(); if(ty && TYPE_LIST.includes(ty) && ty !== found.type){ upd[cp(`floors/${floorOf}/${id}/type`)] = ty; nType++; } }
      }
      if(Object.keys(upd).length){ batch(upd).then(()=>alert(`更新完成：营业额 ${nWin}、场区 ${nZone}、桌型 ${nType}`)); }
      else alert('没有匹配到任何桌子');
    } catch(err){ console.error(err); alert('Excel 解析失败'); }
  };
  reader.readAsArrayBuffer(file);
}

// ========== 加载存档 ==========
async function loadArchive(file){
  const text = await file.text();
  const data = JSON.parse(text);
  if(!data.floorData){ alert('无效存档'); return; }
  if(!confirm('导入将覆盖当前娱乐场的所有数据，继续？')) return;
  const upd = {};
  upd[cp('floors')] = null; upd[cp('decorations')] = null; upd[cp('availableTables')] = null;
  Object.keys(data.floorData).forEach(f => data.floorData[f].forEach(t=>{
    upd[cp(`floors/${f}/${t.id}`)] = { x:t.x, y:t.y, status:t.status||'closed', type:t.type||'BA', zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, angle:t.angle||0, win:t.win||0 };
  }));
  Object.keys(data.availableTables||{}).forEach(id => { upd[cp(`availableTables/${id}`)] = data.availableTables[id]; });
  (data.decorElements||[]).forEach(d => { upd[cp(`decorations/${d.floor}/${d.id}`)] = { url:d.url, x:d.x, y:d.y, width:d.width, height:d.height, angle:d.angle }; });
  await batch(upd);
  showToast('存档已导入');
}

// ========== 数据绑定 ==========
function rebuildLocalState(val){
  const prevFloor = currentFloor;
  const floors = val.floors || {}, decors = val.decorations || {}, avail = val.availableTables || {};
  floorData = {}; availableTables = {}; decorElements = [];
  Object.keys(floors).forEach(fn=>{
    floorData[fn] = [];
    const ts = floors[fn] || {};
    Object.keys(ts).forEach(tid=>{
      const t = ts[tid] || {};
      floorData[fn].push({ id:tid, x:+t.x||0, y:+t.y||0, status:t.status||'closed', type:t.type||'BA', zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, angle:+t.angle||0, win:+t.win||0 });
    });
  });
  Object.keys(avail).forEach(tid=>{
    const t = avail[tid] || {};
    availableTables[tid] = { type:t.type||'BA', zoneCode:t.zoneCode||'', customIcon:t.customIcon||null, win:+t.win||0 };
  });
  Object.keys(decors).forEach(fn=>{
    Object.keys(decors[fn]||{}).forEach(did=>{
      const d = decors[fn][did] || {};
      decorElements.push({ id:+did, floor:fn, url:d.url, x:+d.x||0, y:+d.y||0, width:+d.width||120, height:+d.height||120, angle:+d.angle||0 });
    });
  });
  if(prevFloor && floorData[prevFloor]) currentFloor = prevFloor;
  else currentFloor = Object.keys(floorData)[0] || '1F';
  if(!floorData[currentFloor]) floorData[currentFloor] = [];
}
function bindCasinoData(id){
  if(casinoDataUnsub) casinoDataUnsub();
  casinoDataUnsub = onValue(ref(db, 'casinos/'+id), snap => {
    const val = snap.val() || {};
    rebuildLocalState(val);
    captureState();
    applyZoom(); renderFloorTabs(); renderCurrentFloor(); renderDecorations(); updateTableList(); renderStats(); updateStatsBar();
  });
  if(bgImageUnsub) bgImageUnsub();
  bgImageUnsub = onValue(ref(db, 'casinos/'+id+'/bgImage'), snap => {
    const u = snap.val();
    if(u){ bgImage.src = u; bgImage.style.display = 'block'; }
    else { bgImage.src = ''; bgImage.style.display = 'none'; }
  });
}

// ========== 娱乐场列表 ==========
function bindCasinoList(){
  if(casinoListUnsub) casinoListUnsub();
  casinoListUnsub = onValue(ref(db, 'casinos'), snap => {
    const data = snap.val() || {};
    const ids = Object.keys(data);
    if(!ids.length){ casinoListDiv.innerHTML = '<div class="casino-empty">尚无娱乐场，点击下方「新增娱乐场」开始</div>'; return; }
    ids.sort((a,b)=>(data[b].createdAt||0)-(data[a].createdAt||0));
    casinoListDiv.innerHTML = ids.map(id => `
      <div class="casino-item" data-id="${id}">
        <div class="casino-info">
          <div class="casino-name">🏢 ${esc(data[id].name||id)}</div>
          <div class="casino-meta">${data[id].createdAt ? new Date(data[id].createdAt).toLocaleString() : ''}</div>
        </div>
        <button class="casino-del" data-id="${id}">🗑️ 删除</button>
      </div>
    `).join('');
    casinoListDiv.querySelectorAll('.casino-item').forEach(el=>{
      el.onclick = e => { if(e.target.closest('.casino-del')) return; enterCasino(el.dataset.id); };
    });
    casinoListDiv.querySelectorAll('.casino-del').forEach(btn=>{
      btn.onclick = async e => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if(!confirm(`确定删除「${data[id].name||id}」？此操作不可恢复。`)) return;
        await remove(ref(db, 'casinos/'+id));
        showToast('已删除');
      };
    });
  });
}
async function enterCasino(id){
  currentCasinoId = id;
  if(casinoListUnsub){ casinoListUnsub(); casinoListUnsub = null; }
  casinoOverlay.style.display = 'none';
  appDiv.style.display = 'flex';
  try { const nm = (await get(ref(db, 'casinos/'+id+'/name'))).val(); $('currentCasinoLabel').textContent = nm||id; } catch(e){ $('currentCasinoLabel').textContent = id; }
  if(!window.__appInited){ initUI(); initDropTarget(); initRotatePanel(); refreshAllTypeSelects(); window.__appInited = true; }
  bindCasinoData(id);
}

// ========== UI 绑定 ==========
function initCollapsibleTools(){
  const h = $('collapsibleHeader'), c = $('collapsibleContent'), ic = $('collapseIcon');
  if(!h) return;
  h.onclick = () => { c.classList.toggle('open'); ic.textContent = c.classList.contains('open') ? '▼' : '▶'; };
  c.classList.add('open');
}
function initUI(){
  $('undoBtn').onclick = undo;
  $('clearBtn').onclick = async () => {
    const pwd = prompt('⚠️ 清空需要密码：');
    if(pwd === null) return;
    if(pwd !== '@Abcd1234'){ alert('密码错误'); return; }
    if(!confirm('确认清空当前楼层所有数据？')) return;
    const upd = {};
    upd[cp(`floors/${currentFloor}`)] = null;
    upd[cp(`decorations/${currentFloor}`)] = null;
    await batch(upd);
    showToast('已清空');
  };
  $('zoomIn').onclick = () => setZoom(currentZoom+0.1);
  $('zoomOut').onclick = () => setZoom(currentZoom-0.1);
  $('zoomReset').onclick = () => setZoom(1.0);
  $('saveBtn').onclick = () => {
    const data = { floorData, availableTables, decorElements, currentFloor, version: '3.0' };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'casino_plan.json'; a.click();
    URL.revokeObjectURL(a.href);
    showToast('已导出 casino_plan.json');
  };
  $('toggleSidebarBtn').onclick = () => $('sidebar').classList.toggle('collapsed');
  $('excelImportBtn').onclick = () => { const inp = document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv'; inp.onchange = e => { if(e.target.files[0]) importExcel(e.target.files[0]); }; inp.click(); };
  $('loadArchiveBtn').onclick = () => { const inp = document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange = e => { if(e.target.files[0]) loadArchive(e.target.files[0]); }; inp.click(); };
  $('uploadDecorBtn').onclick = uploadDecor;
  $('toggleStatsBtn').onclick = () => statsSidebar.classList.toggle('open');
  $('closeStatsSidebar').onclick = () => statsSidebar.classList.remove('open');
  canvasAreaDiv.addEventListener('click', e => { if(e.target===canvasAreaDiv || e.target===floorPlanDiv) clearSelection(); });
  $('alignLeft').onclick = alignLeft;
  $('alignRight').onclick = alignRight;
  $('alignCenterH').onclick = alignCenterH;
  $('alignCenterV').onclick = alignCenterV;
  $('distributeHoriz').onclick = distributeH;
  $('distributeVert').onclick = distributeV;
  $('bgUploadBtn').onclick = () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ev => { bgImage.src = ev.target.result; bgImage.style.display = 'block'; update(ref(db, cp('bgImage')), ev.target.result); };
      r.readAsDataURL(f);
    };
    inp.click();
  };
  $('bgDeleteBtn').onclick = () => { bgImage.src=''; bgImage.style.display='none'; remove(ref(db, cp('bgImage'))); };
  $('addTableBtn').onclick = () => { addTableModal.style.display='flex'; newTableIdInput.value=''; newZoneCodeInput.value=''; tempCustomIcon=null; newIconPreview.innerHTML=''; refreshAllTypeSelects(); };
  $('confirmAddTable').onclick = addNewTable;
  $('cancelAddTable').onclick = () => addTableModal.style.display='none';
  $('uploadIconBtn').onclick = () => iconFileInput.click();
  $('clearIconBtn').onclick = () => { tempCustomIcon=null; newIconPreview.innerHTML=''; };
  iconFileInput.onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => { tempCustomIcon = ev.target.result; newIconPreview.innerHTML = `<img src="${tempCustomIcon}" style="max-width:100%;max-height:100%;">`; }; r.readAsDataURL(f); };
  
  // 初始化预设图标网格
  initPresetIconsGrid();

  $('newTypeBtn').onclick = () => { 
      newTypeModal.style.display='flex'; 
      document.querySelectorAll('.preset-icon-item').forEach(el => el.classList.remove('selected'));
      selectedPresetIcon = null;
  };
  
  $('newTypeUploadIconBtn').onclick = () => newTypeIconFile.click();
  newTypeIconFile.onchange = e => { 
    const f = e.target.files[0]; if(!f) return; 
    const r = new FileReader(); 
    r.onload = ev => { 
      newTypeTempIcon = ev.target.result; 
      newTypeIconPreview.innerHTML = `<img src="${newTypeTempIcon}" style="max-width:100%;max-height:100%;">`; 
      newTypeIconPreview.style.display = 'flex';
      document.querySelectorAll('.preset-icon-item').forEach(el => el.classList.remove('selected'));
      selectedPresetIcon = null;
    }; 
    r.readAsDataURL(f); 
  };
  
  $('confirmNewType').onclick = addNewTableType;
  $('cancelNewType').onclick = () => newTypeModal.style.display='none';
  window.onclick = e => { if(e.target===addTableModal) addTableModal.style.display='none'; if(e.target===newTypeModal) newTypeModal.style.display='none'; };
  initCollapsibleTools();
  $('switchCasinoBtn').onclick = () => {
    if(casinoDataUnsub){ casinoDataUnsub(); casinoDataUnsub = null; }
    if(bgImageUnsub){ bgImageUnsub(); bgImageUnsub = null; }
    appDiv.style.display = 'none';
    casinoOverlay.style.display = 'flex';
    bindCasinoList();
  };
}

$('createCasinoBtn').onclick = async () => {
  const name = prompt('娱乐场名称：'); if(!name || !name.trim()) return;
  const newRef = ref(db, 'casinos/' + cid());
  await set(newRef, { name: name.trim(), createdAt: Date.now(), createdBy: 'admin' });
  showToast('娱乐场已新增');
};

// 全局桌型监听
onValue(ref(db, 'customTypes'), snap => {
  const val = snap.val() || {};
  customTypes = {};
  Object.keys(val).forEach(code => {
    if(!DEFAULT_TABLE_TYPES[code]){ TABLE_TYPES[code] = val[code]; customTypes[code] = val[code]; }
  });
  TYPE_LIST = Object.keys(TABLE_TYPES);
  refreshAllTypeSelects();
});
